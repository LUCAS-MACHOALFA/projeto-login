<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | Projeto Web</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="card">
        <h1>Criar conta</h1>
        <p class="subtitulo">Preencha os dados abaixo</p>

        <form id="form-cadastro" novalidate>
            <div class="campo">
                <label for="nome">Nome</label>
                <input type="text" id="nome" name="nome" placeholder="Seu nome completo" required>
            </div>

            <div class="campo">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="seu@email.com" required>
            </div>

            <div class="campo">
                <label for="senha">Senha</label>
                <div class="senha-wrapper">
                    <input type="password" id="senha" name="senha" placeholder="Mínimo 6 caracteres" required>
                    <button type="button" class="btn-mostrar" data-alvo="senha">Mostrar</button>
                </div>
            </div>

            <div class="campo">
                <label for="confirmar">Confirmar senha</label>
                <input type="password" id="confirmar" name="confirmar" placeholder="Repita a senha" required>
            </div>

            <div id="mensagem" class="mensagem" role="alert"></div>

            <button type="submit" class="btn-principal">Cadastrar</button>
        </form>

        <p class="rodape">Já tem conta? <a href="index.html">Entrar</a></p>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
