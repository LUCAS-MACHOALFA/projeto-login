<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Projeto Web</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="card">
        <h1>Entrar</h1>
        <p class="subtitulo">Acesse sua conta para continuar</p>

        <form id="form-login" novalidate>
            <div class="campo">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="seu@email.com" required>
            </div>

            <div class="campo">
                <label for="senha">Senha</label>
                <div class="senha-wrapper">
                    <input type="password" id="senha" name="senha" placeholder="Sua senha" required>
                    <button type="button" class="btn-mostrar" data-alvo="senha">Mostrar</button>
                </div>
            </div>

            <div id="mensagem" class="mensagem" role="alert"></div>

            <button type="submit" class="btn-principal">Entrar</button>
        </form>

        <p class="rodape">Ainda não tem conta? <a href="cadastro.html">Cadastre-se</a></p>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
